<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>मेरे Ads - Bazario</title>
<meta name="theme-color" content="#0d9488">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <div>
      <div class="brand">Bazario<span>.</span></div>
      <div class="brand-sub">मेरे Ads</div>
    </div>
    <button class="icon-btn" id="admin-btn" style="display:none" title="Admin Panel" onclick="location.href='admin.html'">🛡️</button>
    <button class="icon-btn" onclick="location.href='index.html'">🏠</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" id="tab-ads" onclick="showTab('ads')">📦 मेरे Ads</div>
  <div class="tab" id="tab-favs" onclick="showTab('favs')">❤️ पसंद</div>
</div>

<div class="page" id="page"><p class="empty-state">लोड हो रहा है...</p></div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html"><span class="ic">🏠</span>होम</a>
  <a class="nav-item" href="chat.html"><span class="ic">💬</span>चैट</a>
  <a class="nav-item nav-post" href="post.html"><span class="ic">＋</span>Ad डालो</a>
  <a class="nav-item active" href="myads.html"><span class="ic">📦</span>मेरे Ads</a>
</nav>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="./js/firebaseConfig.js"></script>
<script src="./js/app.js"></script>
<script>
let activeTab = 'ads';

function showTab(t) {
  activeTab = t;
  document.getElementById('tab-ads').className = 'tab' + (t === 'ads' ? ' active' : '');
  document.getElementById('tab-favs').className = 'tab' + (t === 'favs' ? ' active' : '');
  if (t === 'ads') loadMyAds(); else loadFavAds();
}

function loginState(page) {
  page.innerHTML = `<div class="empty-state"><div class="big">🔑</div>Login karke apne Ads aur pasand ke Ads dekho।<br><br><button class="btn btn-primary" style="max-width:220px;margin:0 auto" onclick="openAuthModal()">लॉगिन / रजिस्टर</button></div>`;
}

async function loadMyAds() {
  const page = document.getElementById('page');
  if (!window.FIREBASE_READY) { page.innerHTML = ''; return; }
  if (!window.currentUser) return loginState(page);
  try {
    const snap = await window.db.ref('ads').orderByChild('uid').equalTo(window.currentUser.uid).once('value');
    const val = snap.val() || {};
    const ads = Object.keys(val).map(id => ({ id, ...val[id] })).sort((a, b) => b.createdAt - a.createdAt);
    if (!ads.length) {
      page.innerHTML = `<div class="empty-state"><div class="big">📦</div>Abhi tak koi Ad nahi।<br><br><a class="btn btn-primary" style="max-width:220px;margin:0 auto" href="post.html">पहला Ad डालो</a></div>`;
      return;
    }
    page.innerHTML = ads.map(a => `
      <div class="card my-ad-row">
        ${a.photos && a.photos[0] ? `<img src="${a.photos[0]}" onclick="location.href='ad.html?id=${a.id}'" style="cursor:pointer">` : `<div style="width:64px;height:64px;border-radius:12px;background:#e0f2f1;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0">📦</div>`}
        <div class="my-ad-info" onclick="location.href='ad.html?id=${a.id}'" style="cursor:pointer">
          <div style="font-weight:700">${esc(a.title)}</div>
          <div style="color:var(--teal-600);font-weight:800">${fmtPrice(a.price)}</div>
          <div style="font-size:.72rem;color:var(--ink-soft)">${a.status === 'active' ? '🟢 Live' : a.status === 'sold' ? '✅ Bik gaya' : a.status === 'expired' ? '⌛ Muddat khatm' : '⏸️ Band'} · ${timeAgo(a.createdAt)}</div>
        </div>
        <div class="my-ad-actions">
          <a class="small-btn" href="post.html?edit=${encodeURIComponent(a.id)}" aria-label="Ad badlo">✏️</a>
          <button class="small-btn" onclick="toggleStatus('${a.id}','${a.status}')">${a.status === 'active' ? '⏸️' : '▶️'}</button>
          <button class="small-btn red" onclick="delAd('${a.id}')">🗑️</button>
        </div>
      </div>`).join('');
  } catch (e) {
    page.innerHTML = '<div class="empty-state">⚠️ लोड नहीं हुआ।</div>';
  }
}

async function loadFavAds() {
  const page = document.getElementById('page');
  if (!window.FIREBASE_READY) { page.innerHTML = ''; return; }
  if (!window.currentUser) return loginState(page);
  page.innerHTML = '<p class="empty-state">लोड हो रहा है...</p>';
  try {
    const favs = await getFavs();
    const ids = Object.keys(favs);
    if (!ids.length) {
      page.innerHTML = `<div class="empty-state"><div class="big">🤍</div>Abhi koi pasand ka Ad nahi।<br>Home pe kisi bhi Ad ke 🤍 dabao, wo yahan save ho jayega।</div>`;
      return;
    }
    const ads = [];
    for (const adId of ids) {
      const s = await window.db.ref('ads/' + adId).once('value');
      const a = s.val();
      if (a && a.status === 'active') ads.push({ id: adId, ...a });
    }
    ads.sort((a, b) => (favs[b.id] || 0) - (favs[a.id] || 0));
    if (!ads.length) {
      page.innerHTML = `<div class="empty-state"><div class="big">😕</div>Pasand ke Ads ab available nahi hain।</div>`;
      return;
    }
    page.innerHTML = ads.map(a => `
      <div class="card my-ad-row" onclick="location.href='ad.html?id=${a.id}'" style="cursor:pointer">
        ${a.photos && a.photos[0] ? `<img src="${a.photos[0]}">` : `<div style="width:64px;height:64px;border-radius:12px;background:#e0f2f1;display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0">📦</div>`}
        <div class="my-ad-info">
          <div style="font-weight:700">${esc(a.title)}</div>
          <div style="color:var(--teal-600);font-weight:800">${fmtPrice(a.price)}</div>
          <div style="font-size:.72rem;color:var(--ink-soft)">📍 ${esc(a.village || '')}, ${esc(a.district || '')}</div>
        </div>
        <div class="my-ad-actions">
          <button class="small-btn red" onclick="event.stopPropagation();unFav('${a.id}')">💔</button>
        </div>
      </div>`).join('');
  } catch (e) {
    page.innerHTML = '<div class="empty-state">⚠️ लोड नहीं हुआ।</div>';
  }
}

async function unFav(adId) {
  await window.db.ref('users/' + window.currentUser.uid + '/favorites/' + adId).remove();
  showToast('पसंद से हटा दिया');
  loadFavAds();
}

async function toggleStatus(id, status) {
  if (!window.currentUser) return;
  const ref = window.db.ref('ads/' + id);
  const current = (await ref.once('value')).val();
  if (!current || current.uid !== window.currentUser.uid) return;
  await ref.update({ status: current.status === 'active' ? 'paused' : 'active' });
  loadMyAds();
}
async function delAd(id) {
  if (!confirm('Pakka delete karein?')) return;
  const a = (await window.db.ref('ads/' + id).once('value')).val();
  if (!window.currentUser || !a || a.uid !== window.currentUser.uid) return;
  await window.db.ref('ads/' + id).remove();
  showToast('🗑️ Ad delete ho gaya');
  loadMyAds();
}

renderSetupBannerIfNeeded();
injectAuthModal();
initAuth((user) => {
  var ab=document.getElementById('admin-btn'); if(ab) ab.style.display=(user && user.email===window.ADMIN_EMAIL)?'':'none';
  if (sessionStorage.getItem('openFavs') === '1' || location.hash === '#favs') { sessionStorage.removeItem('openFavs'); activeTab = 'favs'; }
  showTab(activeTab);
});
</script>
</body>
</html>
